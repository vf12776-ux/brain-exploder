
<!DOCTYPE html>
<html>
<head>
  <base href="/brain-exploder/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="icons/icon77.png">
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="icons/icon77.png"/>
  <meta name="theme-color" content="#0D47A1">
<meta name="msapplication-TileColor" content="#0D47A1">
<meta name="msapplication-TileImage" content="assets/icons/icon77.png">
<meta name="application-name" content="Brain Exploder">
  <title>Brain Exploder</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0D47A1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-family: Arial, sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
      margin: 20px 0;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div style="font-size: 60px;">🚀</div>
    <h1>BRAIN EXPLODER</h1>
    <div class="spinner"></div>
    <p>Загружаем...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
   <script>
    // Скрываем сплеш-скрин когда Flutter загрузится
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(function() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
        }
      }, 500);
    });

    // Защита от зависания - скрыть через 5 секунд в любом случае
    setTimeout(function() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
      }
    }, 5000);
  </script>
  <script>
// Расширенный патч для GitHub API
window.addEventListener('load', function() {
  console.log('Applying enhanced GitHub API patch...');
  
  // Патч для fetch
  const originalFetch = window.fetch;
  window.fetch = function(...args) {
    const url = args[0];
    
    if (url && url.includes('api.github.com/users/') && url.includes('/events')) {
      console.log('Intercepting GitHub events request...');
      return originalFetch.apply(this, args).then(response => {
        return response.json().then(events => {
          console.log('Raw events from GitHub:', events);
          
          // Более агрессивное исправление
          const patchedEvents = events.map(event => {
            if (event.type === 'PushEvent') {
              console.log('Patching PushEvent:', event.id);
              // Гарантированно добавляем commits
              event.payload.commits = event.payload.commits || [];
              if (event.payload.commits.length === 0) {
                // Создаем реалистичный коммит
                event.payload.commits = [{
                  sha: event.payload.head || 'default_sha',
                  message: 'Auto-patched commit'
                }];
              }
            }
            return event;
          });
          
          console.log('Patched events:', patchedEvents);
          return new Response(JSON.stringify(patchedEvents), {
            status: response.status,
            statusText: response.statusText,
            headers: response.headers
          });
        });
      });
    }
    return originalFetch.apply(this, args);
  };

  // Дополнительно патчим XMLHttpRequest на случай если используется он
  const originalXHR = window.XMLHttpRequest;
  window.XMLHttpRequest = function() {
    const xhr = new originalXHR();
    const originalOpen = xhr.open;
    const originalSend = xhr.send;
    
    xhr.open = function(method, url, ...rest) {
      this._url = url;
      return originalOpen.apply(this, [method, url, ...rest]);
    };
    
    xhr.send = function(...args) {
      if (this._url && this._url.includes('api.github.com/users/') && this._url.includes('/events')) {
        const originalOnReadyStateChange = this.onreadystatechange;
        this.onreadystatechange = function() {
          if (this.readyState === 4 && this.status === 200) {
            try {
              const events = JSON.parse(this.responseText);
              console.log('XHR - Raw events:', events);
              
              const patchedEvents = events.map(event => {
                if (event.type === 'PushEvent') {
                  event.payload.commits = event.payload.commits || [];
                  if (event.payload.commits.length === 0) {
                    event.payload.commits = [{
                      sha: event.payload.head || 'default_sha',
                      message: 'Auto-patched commit'
                    }];
                  }
                }
                return event;
              });
              
              console.log('XHR - Patched events:', patchedEvents);
              
              // Переопределяем responseText
              Object.defineProperty(this, 'responseText', {
                value: JSON.stringify(patchedEvents),
                writable: false
              });
            } catch (e) {
              console.error('Error patching XHR response:', e);
            }
          }
          if (originalOnReadyStateChange) {
            originalOnReadyStateChange.apply(this, arguments);
          }
        };
      }
      return originalSend.apply(this, args);
    };
    
    return xhr;
  };
  
  // Принудительно вызываем обновление данных через 3 секунды
  setTimeout(() => {
    console.log('Forcing data refresh...');
    // Попытка вызвать метод обновления если он существует в глобальной области
    if (window.refreshGitHubData) {
      window.refreshGitHubData();
    }
    // Или диспатчим кастомное событие
    window.dispatchEvent(new CustomEvent('force-github-refresh'));
  }, 3000);
});
</script>
</body>
</html>
