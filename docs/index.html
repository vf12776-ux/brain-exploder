
<!DOCTYPE html>
<html>
<head>
  <base href="/brain-exploder/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="assets/icons/icon77.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="assets/icons/icon77.png"/>

  <title>Brain Exploder</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0D47A1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-family: Arial, sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
      margin: 20px 0;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div style="font-size: 60px;">🚀</div>
    <h1>BRAIN EXPLODER</h1>
    <div class="spinner"></div>
    <p>Загружаем...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
   <script>
    // Скрываем сплеш-скрин когда Flutter загрузится
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(function() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
        }
      }, 500);
    });

    // Защита от зависания - скрыть через 5 секунд в любом случае
    setTimeout(function() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
      }
    }, 5000);
  </script>
</body>
</html>
