
<!DOCTYPE html>
<html>
<head>
  <base href="/brain-exploder/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="icons/icon77.png">
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="icons/icon77.png"/>
  <meta name="theme-color" content="#0D47A1">
<meta name="msapplication-TileColor" content="#0D47A1">
<meta name="msapplication-TileImage" content="assets/icons/icon77.png">
<meta name="application-name" content="Brain Exploder">
  <title>Brain Exploder</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0D47A1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-family: Arial, sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
      margin: 20px 0;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div style="font-size: 60px;">🚀</div>
    <h1>BRAIN EXPLODER</h1>
    <div class="spinner"></div>
    <p>Загружаем...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
   <script>
    // Скрываем сплеш-скрин когда Flutter загрузится
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(function() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
        }
      }, 500);
    });

    // Защита от зависания - скрыть через 5 секунд в любом случае
    setTimeout(function() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
      }
    }, 5000);
  </script>
  <script>
// Простой патч для GitHub API
window.addEventListener('load', function() {
  console.log('Applying GitHub API patch...');
  
  // Перехватываем запросы к GitHub API
  const originalFetch = window.fetch;
  window.fetch = function(...args) {
    const url = args[0];
    
    // Если это запрос к событиям GitHub
    if (url && url.includes('api.github.com/users/') && url.includes('/events')) {
      return originalFetch.apply(this, args).then(response => {
        return response.json().then(events => {
          console.log('Patching', events.length, 'GitHub events');
          
          // Исправляем каждое событие PushEvent
          const patchedEvents = events.map(event => {
            if (event.type === 'PushEvent') {
              // Добавляем поле commits если его нет
              if (!event.payload.commits) {
                event.payload.commits = [{}]; // Простой коммит
              }
            }
            return event;
          });
          
          // Возвращаем исправленные данные
          return new Response(JSON.stringify(patchedEvents), {
            status: response.status,
            statusText: response.statusText,
            headers: response.headers
          });
        });
      });
    }
    
    // Для других запросов ничего не меняем
    return originalFetch.apply(this, args);
  };
});
</script>
</body>
</html>
